name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          # Pinned so a ruff release cannot silently change which rules fire.
          pip install 'ruff==0.17.0'
          ruff check --select E9,F63,F7,F82,F401 .
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q .
